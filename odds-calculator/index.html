<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>競馬 合成オッズ計算</title>
    <meta name="description" content="競馬の合成オッズと資金配分を計算し、青単条件の候補馬を判定します。">
    <link rel="stylesheet" href="style.css?v=3.0">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <meta name="theme-color" content="#111111">
</head>

<body>
    <header class="app-header">
        <h1>競馬 合成オッズ</h1>
        <button id="reset-btn" aria-label="リセット" title="リセット">↺</button>
    </header>

    <main class="app-container">
        <section class="card budget-card">
            <label for="total-budget">総予算</label>
            <div class="input-group large">
                <span class="currency">¥</span>
                <input type="number" id="total-budget" value="10000" inputmode="numeric" min="0">
            </div>
        </section>

        <section class="card blue-tan-card">
            <div class="card-header">
                <h2>青単チェック</h2>
                <span id="blue-tan-status" class="blue-tan-status neutral">判定待ち</span>
            </div>

            <div class="blue-tan-controls">
                <label>
                    <span>1番人気オッズ</span>
                    <input type="number" id="blue-tan-favorite-odds" value="2.5" step="0.1" inputmode="decimal">
                </label>
                <label>
                    <span>期待回収率</span>
                    <input type="number" id="blue-tan-min-roi" value="150" step="1" inputmode="numeric">
                </label>
                <label>
                    <span>指数欄数</span>
                    <input type="number" id="blue-tan-min-index" value="2" min="0" max="4" inputmode="numeric">
                </label>
            </div>

            <div class="blue-tan-result">
                <strong id="blue-tan-pick">候補を入力してください</strong>
                <p id="blue-tan-detail">6〜9番人気、期待回収率150%以上、主要4欄のうち2欄以上が5位以内を判定します。</p>
            </div>
        </section>

        <section class="card odds-card">
            <div class="card-header">
                <h2>候補馬</h2>
                <span id="horse-count" class="badge">0頭</span>
            </div>

            <div class="horse-grid-head">
                <span>人気</span>
                <span>単勝</span>
                <span>指数</span>
                <span>購入</span>
                <span></span>
            </div>
            <div id="odds-list"></div>

            <button id="add-horse-btn" class="btn-secondary">
                <span>+</span> 候補を追加
            </button>
        </section>

        <section id="result-section" class="card result-card hidden">
            <div class="result-header">
                <h2>計算結果</h2>
                <div class="expected-return">
                    <small>最低払戻</small>
                    <span id="expected-payout">0</span>
                    <span class="unit">円</span>
                </div>
            </div>

            <div class="profit-info">
                <div class="profit-item">
                    <span class="label">投資合計</span>
                    <span><span id="total-investment">0</span>円</span>
                </div>
                <div class="profit-item highlight">
                    <span class="label">最低利益</span>
                    <span><span id="expected-profit">+0</span>円</span>
                </div>
                <div class="profit-item">
                    <span class="label">回収率</span>
                    <span><span id="return-rate">0</span>%</span>
                </div>
                <div class="profit-item">
                    <span class="label">合成オッズ</span>
                    <span><span id="synthetic-odds">0.00</span>倍</span>
                </div>
            </div>

            <button id="share-btn" class="btn-share">Xでシェア</button>
        </section>
    </main>

    <script src="app.js?v=3.0"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        }
    </script>
</body>

</html>
